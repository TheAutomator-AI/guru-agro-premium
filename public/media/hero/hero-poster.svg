  <circle cx="1340" cy="320" r="120" stroke="rgba(200, 157, 60, 0.1)" stroke-width="1" stroke-dasharray="4 8" fill="none" />
  
  <text x="120" y="540" font-family="'Cinzel', Georgia, serif" font-size="44" fill="#f8f5ee" letter-spacing="4">GURU AGRO PRODUCTS</text>
  <text x="120" y="590" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#c89d3c" letter-spacing="6">SUSTAINABLE AGRO-ECOSYSTEM ARCHITECTURE</text>
