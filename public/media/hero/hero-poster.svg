<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120c" />
      <stop offset="50%" stop-color="#0a1c13" />
      <stop offset="100%" stop-color="#143223" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(200, 157, 60, 0.25)" />
      <stop offset="100%" stop-color="rgba(10, 28, 19, 0)" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#hero-grad)" />
